# Configures Dependabot to automatically scan for outdated dependencies and open PRs to update them.
version: 2

updates:

  # --------------------------------------------------------------------------------------------------------------------
  # -------------------------------------------------- maven ecosystem -------------------------------------------------
  # --------------------------------------------------------------------------------------------------------------------

  #  Scans the pom.xml for outdated dependencies and plugin versions.
  #  e.g. when JaCoCo releases a new version, Dependabot opens a PR bumping it automatically.
  - package-ecosystem: "maven"

    # Tells Dependabot where to look for the pom.xml file relative to the repository root (/pom.xml).
    directory: "/"

    # Checks once a week, not on every push. Avoids PR noise.
    schedule:
      interval: "weekly"

    # Caps how many open Dependabot PRs can exist at once per ecosystem.
    # Prevents PRs being flooded if many dependencies update simultaneously.
    open-pull-requests-limit: 5

    # Makes Dependabot's PR titles follow a Conventional Commits format.
    # e.g. chore: bump JUnit from x to y
    # This is needed because we are enforcing and validating it in the ci-validate-pr-title.yml GitHub Actions workflow.
    commit-message:
      prefix: "chore"

  # --------------------------------------------------------------------------------------------------------------------
  # ------------------------------------------- github-actions ecosystem -----------------------------------------------
  # --------------------------------------------------------------------------------------------------------------------

  #  Scans the workflow files (.github/workflows/*.yml) for outdated action versions.
  #  e.g. when actions/checkout@v4 gets a new release, Dependabot opens a PR bumping it automatically.
  - package-ecosystem: "github-actions"

    # Tells Dependabot where to look for the workflow files relative to the repository root (/.github/workflows/).
    # / is just a conventional value, as GitHub hardcodes this location for the github-actions ecosystem.
    directory: "/"

    # Checks once a week, not on every push. Avoids PR noise.
    schedule:
      interval: "weekly"

    # Caps how many open Dependabot PRs can exist at once per ecosystem.
    # Prevents PRs being flooded if many dependencies update simultaneously.
    open-pull-requests-limit: 5

    # Makes Dependabot's PR titles follow a Conventional Commits format.
    # e.g. chore: bump actions/checkout from x to y
    # This is needed because we are enforcing and validating it in the ci-validate-pr-title.yml GitHub Actions workflow.
    commit-message:
      prefix: "chore"

    # We deliberately pin GitHub Actions to major-version-only tags (@v5, @v4), which already receive patch/minor
    # updates automatically without needing a PR. Without this, Dependabot proposes "tightening" the tag to an exact
    # version (e.g. v5 → v5.6.0) — which would abandon that convention and create a new PR for every future patch
    # release instead of none.
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch", "version-update:semver-minor" ]
