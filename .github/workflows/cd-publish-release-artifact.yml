# Publishes release versions to Maven Central when a version tag (vX.Y.Z) is pushed.

# Waits for manual approval in production, then builds, verifies the version is not a SNAPSHOT, signs with GPG,
# and publishes using the `central-publishing-maven-plugin` via the release profile. Requires valid GPG and
# Maven Central credentials.

# Workflow name — user defined — can be any descriptive name
name: Publish Release

# Runs on tag pushes matching vX.Y.Z (v0.1.0, v1.0.0, v2.13.4), explicitly excluding any suffixed tag like
# v0.1.0-SNAPSHOT (the negation pattern below). This is the first of three layers guarding against a SNAPSHOT or
# malformed tag — none is a complete guarantee alone, since GitHub's tag-filter glob syntax can't express every
# malformed shape precisely. See the job-level "if" condition and "Validate Release Tag" step below for the other two.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v[0-9]*.[0-9]*.[0-9]*-*'

jobs:

  # Job ID — user defined — can be any descriptive name
  publish-release-artifact:
    name: Publish Release Artifact To Maven Central
    runs-on: ubuntu-latest

    # Second layer — on top of the trigger-level glob exclusion above — rejects any tag containing "SNAPSHOT" at zero
    # compute cost, since the job is skipped entirely (no runner provisioned) before "Validate Release Tag" below would
    # otherwise catch it.
    if: "!contains(github.ref_name, 'SNAPSHOT')"

    # Links this job to the 'production' GitHub environment for deployment tracking.
    # Pauses here for manual approval.
    environment: production

    # Explicit permissions required.
    permissions:

      # Allows the workflow to read repository source code, configuration files, etc. for analysis.
      contents: read

    steps:

      # Step-1 — Checkout the repository
      - name: Checkout Repository

        # Use actions/checkout GitHub Action to clone the repository into the runner workspace (GITHUB_WORKSPACE).
        uses: actions/checkout@v7

      # Step-2 — Strictly validate the pushed tag name
      - name: Validate Release Tag

        # Third and comprehensive layer, catching anything the trigger-level glob exclusion and job-level "if" above
        # don't — real shell regex, not glob or a plain substring check, so it can precisely require
        # "digits only, then end of string".
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✗ Tag '$TAG' does not match the strict release pattern vX.Y.Z"
            exit 1
          fi
          echo "✓ Tag '$TAG' accepted"

      # Step-3 — Setup JDK
      - name: Setup JDK 21

        # Use actions/setup-java GitHub Action to install and configure the specified JDK in the runner.
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # matches `publishingServerId` in the release profile's `central-publishing-maven-plugin` config.

      # Step-4 — Import the GPG key
      - name: Import GPG Key

        # SonarQube will flag the below action as a security risk and fail the analysis.
        # Reason: External GitHub Actions and workflows should be pinned to a commit hash 'githubactions:S7637'.
        # So we have to either suppress S7637 as Won't Fix/False Positive in SonarQube or use the full commit hash.

        # Use crazy-max/ghaction-import-gpg GitHub Action to import the GPG private key into the runner's keyring for
        # artifact signing.
        # v7.0.0
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Step-5 — Verify the version is not a SNAPSHOT
      - name: Verify the version is release (not SNAPSHOT)

        # Checks pom.xml's own project.version — a separate concern from Step-2's tag-name check. A mismatch between
        # the two (e.g. a correctly-tagged release built from a commit where the POM is still SNAPSHOT) is exactly what
        # this step catches.
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ $VERSION == *-SNAPSHOT ]]; then
            echo "✗ Cannot release a SNAPSHOT version ($VERSION)"
            exit 1
          fi
          echo "✓ Releasing version: $VERSION"

      # Step-6 — Build and publish to Maven Central
      - name: Build & Publish to Maven Central
        run: mvn deploy -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # maven-gpg-plugin 3.1.0+ auto-reads MAVEN_GPG_PASSPHRASE when `--pinentry-mode` is set `loopback`.
